<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADVfactory — mapa kierunków transportu</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#161512;overflow:hidden}
  #map{width:100%;height:100%;display:block}
  .lbl{font:700 11px "Archivo",sans-serif;fill:#F2EFE7;paint-order:stroke;stroke:#161512;stroke-width:3.5px;stroke-linejoin:round}
  .lbl-past{font:600 10px "Archivo",sans-serif;fill:#B9B3A6;paint-order:stroke;stroke:#161512;stroke-width:3px;stroke-linejoin:round}
  .lbl-mono{font:500 9.5px "IBM Plex Mono",monospace;fill:#F26A1B;paint-order:stroke;stroke:#161512;stroke-width:3px;stroke-linejoin:round}
  .lgd{font:600 10px "IBM Plex Mono",monospace;fill:#B9B3A6}
  .hit{cursor:pointer}
  .rt{transition:opacity .18s ease}
  #tip{position:absolute;pointer-events:none;background:#1C1B17;border:1px solid #3A3831;border-radius:6px;padding:9px 11px;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .12s ease;max-width:220px}
  #tip .n{font:700 12.5px "Archivo",sans-serif;color:#F2EFE7}
  #tip .p{font:600 11px "IBM Plex Mono",monospace;color:#F26A1B;margin-top:3px}
  #tip .d{font:500 10px "IBM Plex Mono",monospace;color:#B9B3A6;margin-top:3px}
  #tgl{position:absolute;right:14px;top:12px;display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;background:rgba(28,27,23,.92);border:1px solid #3A3831;border-radius:4px;color:#B9B3A6;font:700 10px "Archivo",sans-serif;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none}
  #tgl:hover{color:#F2EFE7;border-color:#7E796E}
  #tgl .sw{width:28px;height:16px;border-radius:99px;background:#3A3831;position:relative;transition:background .15s}
  #tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#F2EFE7;transition:left .15s}
  #tgl.on .sw{background:#EA5A0B}#tgl.on .sw::after{left:14px}
</style>
</head>
<body>
<svg id="map"></svg>
<img src="assets/logo-white.png" alt="ADVfactory" style="position:absolute;left:14px;bottom:12px;height:16px;opacity:.85;pointer-events:none">
<div id="tip"><div class="n"></div><div class="p"></div><div class="d"></div></div>
<div id="tgl"><span class="sw"></span><span id="tglTxt"></span></div>
<script>
let showAll = false;
const NEXT = { "Biszkek":"25.04.2026", "Reykjavík":"01.07.2026", "Władywostok":"powrót 30.09.2026", "Islamabad":"powrót 20.10.2026", "Valparaíso":"15.11.2026", "Kapsztad":"06.01.2027", "Mombasa":"powrót 10.04.2027" };
const tip = document.getElementById("tip");
function showTip(evt, name, price, date){
  tip.querySelector(".n").textContent = name;
  tip.querySelector(".p").textContent = price || "";
  tip.querySelector(".d").textContent = date || "";
  tip.style.opacity = 1;
  const r = document.body.getBoundingClientRect();
  const x = evt.clientX - r.left + 14, y = evt.clientY - r.top - 10;
  tip.style.left = Math.min(x, r.width - 240) + "px"; tip.style.top = Math.max(8, y) + "px";
}
function hideTip(){ tip.style.opacity = 0; }
const EN = new URLSearchParams(location.search).get("lang") === "en";
const HUB = { lon:20.28, lat:52.30 };

/* kierunki z terminarza advfactory.com/transport */
const CURRENT = [
  { name:"Biszkek",     en:"Bishkek",      lon:74.59,  lat:42.87,  tag:"⇔ 1800 €", dx:9,   dy:-4 },
  { name:"Osz",         en:"Osh",          lon:72.79,  lat:40.53,  tag:"powrót",   en_tag:"return", dx:6, dy:16, small:true },
  { name:"Reykjavík",   en:"Reykjavík",    lon:-21.94, lat:64.15,  tag:"⇔ 1550 €", dx:10,  dy:-4 },
  { name:"Władywostok", en:"Vladivostok",  lon:131.89, lat:43.12,  tag:"⇒ 1800 €", dx:9,   dy:14 },
  { name:"Islamabad",   en:"Islamabad",    lon:73.06,  lat:33.69,  tag:"⇒ 1500 €", dx:9,   dy:16 },
  { name:"Valparaíso",  en:"Valparaíso",   lon:-71.62, lat:-33.05, tag:"⇔ 2300 €", dx:-9,  dy:0,  anchor:"end" },
  { name:"Punta Arenas",en:"Punta Arenas", lon:-70.92, lat:-53.16, tag:"powrót",   en_tag:"return", dx:-8, dy:12, anchor:"end", small:true },
  { name:"Arica",       en:"Arica",        lon:-70.31, lat:-18.48, tag:"powrót",   en_tag:"return", dx:-8, dy:4,  anchor:"end", small:true },
  { name:"Kapsztad",    en:"Cape Town",    lon:18.42,  lat:-33.92, tag:"⇒ 1500 €", dx:8,   dy:14 },
  { name:"Mombasa",     en:"Mombasa",      lon:39.67,  lat:-4.04,  tag:"⇒ 1400 €", dx:9,   dy:2 }
];

/* kierunki, na które wozimy poza stałym terminarzem — wyprawy 2019–2027 */
const OTHER = [
  { name:"Katmandu",    en:"Kathmandu",    lon:85.32,  lat:27.71,  dx:4,  dy:24 },
  { name:"Bangkok",     en:"Bangkok",      lon:100.50, lat:13.75,  dx:7,  dy:12 },
  { name:"Delhi",       en:"Delhi",        lon:77.21,  lat:28.61,  dx:-8, dy:14, anchor:"end" },
  { name:"Hanoi",       en:"Hanoi",        lon:105.83, lat:21.03,  dx:7,  dy:-4 },
  { name:"Toamasina",   en:"Toamasina",    lon:49.40,  lat:-18.15, dx:8,  dy:4 },
  { name:"Dar es Salaam", en:"Dar es Salaam", lon:39.28, lat:-6.79, dx:9, dy:24 },
  { name:"Buenos Aires",en:"Buenos Aires", lon:-58.38, lat:-34.60, dx:8,  dy:12 },
  { name:"Lima",        en:"Lima",         lon:-77.04, lat:-12.05, dx:-8, dy:0, anchor:"end" },
  { name:"Stambuł",     en:"Istanbul",     lon:28.98,  lat:41.01,  dx:6,  dy:16 },
  { name:"Anchorage",   en:"Anchorage",    lon:-149.90,lat:61.22,  dx:9,  dy:-2 },
  { name:"Los Angeles", en:"Los Angeles",  lon:-118.24,lat:34.05,  dx:-8, dy:2, anchor:"end" },
  { name:"Nowy Jork",   en:"New York",     lon:-74.00, lat:40.71,  dx:8,  dy:-4 }
];

const svg = d3.select("#map");
let world = null;

async function boot(){
  const topo = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json");
  world = topojson.feature(topo, topo.objects.countries);
  draw();
  window.addEventListener("resize", () => { clearTimeout(window.__t); window.__t = setTimeout(draw, 120); });
}

function draw(){
  const w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;
  svg.attr("viewBox", [0,0,w,h]).attr("width", w).attr("height", h);
  svg.selectAll("*").remove();
  const projection = d3.geoNaturalEarth1().fitExtent([[16, 30],[w-16, h-30]], { type:"Sphere" });
  const path = d3.geoPath(projection);

  svg.append("path").attr("d", path({type:"Sphere"})).attr("fill","#12110F");
  svg.append("path").attr("d", path(d3.geoGraticule10())).attr("fill","none").attr("stroke","#26241F").attr("stroke-width",.6);
  svg.append("g").selectAll("path").data(world.features).join("path")
    .attr("d", path).attr("fill","#23221D").attr("stroke","#38352E").attr("stroke-width",.7);

  const g = svg.append("g");
  const line = (d, color, width, dash) => g.append("path")
    .attr("d", path({ type:"LineString", coordinates:[[HUB.lon,HUB.lat],[d.lon,d.lat]] }))
    .attr("fill","none").attr("stroke",color).attr("stroke-width",width)
    .attr("stroke-opacity", dash ? .75 : .85).attr("stroke-linecap","round")
    .attr("stroke-dasharray", dash || null);

  const compact = w < 700;
  const routes = [];
  const focus = (id) => { routes.forEach(r => r.el.style("opacity", id===null || r.id===id ? 1 : .18)); };

  const addRoute = (d, kind) => {
    const id = d.name;
    const grp = g.append("g").attr("class","rt hit");
    const p = projection([d.lon, d.lat]); if(!p) return;
    const name = EN ? d.en : d.name;
    const isCur = kind === "cur";
    const price = isCur && !d.small ? d.tag : (d.small ? (EN ? "return port" : "port powrotu") : (EN ? "on request" : "na zamówienie"));
    const date = isCur && !d.small ? ((EN ? "next packing: " : "najbliższe pakowanie: ") + (NEXT[d.name] || "—")) : (isCur ? "" : (EN ? "shipped 2019–2027 with our expeditions" : "woziliśmy z wyprawami 2019–2027"));

    if (!d.small) grp.append("path")
      .attr("d", path({ type:"LineString", coordinates:[[HUB.lon,HUB.lat],[d.lon,d.lat]] }))
      .attr("fill","none").attr("stroke", isCur ? "#EA5A0B" : "#8A857A").attr("stroke-width", isCur ? 1.8 : 1.1)
      .attr("stroke-opacity", isCur ? .9 : .6).attr("stroke-linecap","round").attr("stroke-dasharray", isCur ? null : "3 5");
    grp.append("path")
      .attr("d", path({ type:"LineString", coordinates:[[HUB.lon,HUB.lat],[d.lon,d.lat]] }))
      .attr("fill","none").attr("stroke","transparent").attr("stroke-width",12);

    if (isCur && d.small) {
      grp.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r",3.4).attr("fill","#161512").attr("stroke","#F26A1B").attr("stroke-width",1.6);
    } else if (isCur) {
      grp.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r",4.6).attr("fill","#F26A1B").attr("stroke","#161512").attr("stroke-width",1.5);
      const a = d.anchor || "start";
      grp.append("text").attr("class","lbl").attr("x",p[0]+d.dx).attr("y",p[1]+d.dy).attr("text-anchor",a).text(name);
      if (!compact) grp.append("text").attr("class","lbl-mono").attr("x",p[0]+d.dx).attr("y",p[1]+d.dy+12).attr("text-anchor",a).text(d.tag);
    } else {
      grp.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r",2.6).attr("fill","#161512").attr("stroke","#B9B3A6").attr("stroke-width",1.3);
      if (showAll && !compact) grp.append("text").attr("class","lbl-past").attr("x",p[0]+d.dx).attr("y",p[1]+d.dy).attr("text-anchor", d.anchor || "start").text(name);
    }
    grp.on("mousemove", (evt) => { focus(id); showTip(evt, name, price, date); })
       .on("mouseleave", () => { focus(null); hideTip(); });
    routes.push({ id, el: grp });
  };

  if (showAll) OTHER.forEach(d => addRoute(d, "old"));
  CURRENT.forEach(d => addRoute(d, "cur"));

  const hp = projection([HUB.lon, HUB.lat]);
  g.append("rect").attr("x",hp[0]-5).attr("y",hp[1]-5).attr("width",10).attr("height",10)
    .attr("fill","#F2EFE7").attr("stroke","#161512").attr("stroke-width",1.5);
  g.append("text").attr("class","lbl-mono").attr("x",hp[0]).attr("y",hp[1]-11)

  const lg = svg.append("g").attr("transform", "translate(18," + (h - 34) + ")");
  const item = (x, drawSwatch, label) => {
    drawSwatch(x);
    lg.append("text").attr("class","lgd").attr("x", x + 22).attr("y", 4).text(label);
  };
  item(0, (x)=>{ lg.append("line").attr("x1",x).attr("x2",x+16).attr("y1",0).attr("y2",0)
      .attr("stroke","#EA5A0B").attr("stroke-width",2.4).attr("stroke-linecap","round"); },
    EN ? "regular sailings (schedule)" : "stałe kierunki z terminarza");
  if (showAll && !compact) {
    const shift = EN ? 232 : 236;
    item(shift, (x)=>{ lg.append("line").attr("x1",x).attr("x2",x+16).attr("y1",0).attr("y2",0)
        .attr("stroke","#7E796E").attr("stroke-width",2).attr("stroke-dasharray","3 4").attr("stroke-linecap","round"); },
      EN ? "shipped on request (2019–2027)" : "woziliśmy i wozimy na zamówienie");
  }
  if (!compact) item(showAll ? (EN ? 472 : 500) : (EN ? 232 : 236), (x)=>{ lg.append("circle").attr("cx",x+8).attr("cy",0).attr("r",3.2).attr("fill","#161512").attr("stroke","#F26A1B").attr("stroke-width",1.6); },
    EN ? "return port (hover for name)" : "port powrotu (nazwa po najechaniu)");

  const tgl = document.getElementById("tgl");
  tgl.className = showAll ? "on" : "";
  document.getElementById("tglTxt").textContent = EN ? ("All destinations · " + (CURRENT.filter(c=>!c.small).length + OTHER.length)) : ("Wszystkie kierunki · " + (CURRENT.filter(c=>!c.small).length + OTHER.length));
  tgl.onclick = () => { showAll = !showAll; draw(); };
}
boot();
</script>
</body>
</html>
